name: Gate Conformance Matrix
experiment: hermes-perm-audit-002
generated: 2026-05-27

# Tests whether worker_daemon path conforms to marker_executor canonical path

paths:
  - marker_executor
  - worker_daemon

conformance_cases:
  - id: C001
    name: worker uses canonical gate function
    expected: true
    actual: false
    status: fail
    evidence:
      - local_execution_worker.py:113-193 defines independent check_worker_gates
      - Never imports check_gates from local_marker_executor
      - Never imports flags_from_env from local_marker_executor
    severity: critical

  - id: C002
    name: worker independent gate covers all marker gates
    expected: true
    actual: false
    status: fail
    evidence:
      - Worker missing: LIVE_ENABLED, idempotency key, scope re-validation, rollback plan, audit writability
      - Worker has: approval check, arm gate check, dry-run check, R4/R5 check, private content check
      - Coverage: ~10/25 vs marker's ~12/25
    severity: critical

  - id: C003
    name: worker and marker produce same deny/allow for P0 cases
    expected: true
    actual: false
    status: fail
    evidence:
      - D001: marker denies, worker allows (LIVE_ENABLED missing)
      - D002: marker denies, worker allows (LIVE_ENABLED=false)
      - D010: marker denies, worker allows (idempotency key missing)
      - D005/D006/D018/D019: both deny (conformant)
    severity: critical

  - id: C004
    name: worker has no bypass entry that skips marker gates
    expected: true
    actual: unknown
    status: untested
    evidence:
      - Worker is a daemon that processes requests from queue
      - Marker executor is called by CLI commands
      - Different entry points, same queue file
      - Need to verify: can a request reach worker without going through marker gates?
    severity: high

  - id: C005
    name: worker does not execute after deny
    expected: true
    actual: partial
    status: partial
    evidence:
      - check_worker_gates raises WorkerError on deny (line 193)
      - worker_run_once catches WorkerError (line 232)
      - But: if gate check itself has bug (missing gate), execution proceeds
    severity: critical

