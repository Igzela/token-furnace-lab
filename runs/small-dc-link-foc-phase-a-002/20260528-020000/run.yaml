experiment_id: phase-a-002
type: foc-interface-design
status: in_progress
created: 2026-05-28T02:00:00Z
parent: phase-a-001

description: |
  FOC interface design for TMS320F28035. Defines C header interfaces
  for all FOC modules: fixed-point types, per-module I/O structs,
  ISR entry points, and data flow contracts.

scope:
  - C struct definitions for 7 FOC modules
  - Fixed-point type system (Q15, Q12, Q12-acc)
  - ISR signatures (10kHz current, 1kHz speed)
  - Module initialization interface
  - Vdc feedforward normalization

exclusions:
  - APD interfaces (Phase C)
  - Startup/I-f interfaces (Phase B)
  - 22µF ripple handling (Phase C)
  - Actual implementation code

acceptance_criteria:
  - All 7 modules have C struct definitions
  - Fixed-point types consistent across modules
  - ISR signatures defined
  - Data flow matches A-001 signal flow
  - RAM budget within 12KB limit
